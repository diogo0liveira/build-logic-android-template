name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      -   name: Validate Commits
          uses: diogo0liveira/.github/.github/actions/commit-lint@main

      - name: Set up JDK 26
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Code Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run Static Code Analysis (Detekt)
        id: detekt
        run: ./gradlew detekt

      - name: Upload Detekt Reports
        if: failure() && steps.detekt.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Tests & Generate Coverage Report
        id: test
        run: ./gradlew jacocoAggregateReport -Pcoverage=true

      - name: Upload Test Reports
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload JaCoCo Coverage Reports
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-coverage-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify Code Coverage Thresholds
        run: ./gradlew jacocoCoverageVerification -Pcoverage=true

      - name: Build Project & Lint
        id: build
        run: ./gradlew build -Pcoverage=true

      - name: Upload Lint Reports
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*'
          retention-days: 7
          if-no-files-found: ignore
