name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      -   name: Validate Commits
          uses: diogo0liveira/.github/.github/actions/commit-lint@main

      - name: Set up JDK 26
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify Code Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run Static Code Analysis (Detekt)
        run: ./gradlew detekt

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Project & Lint
        run: ./gradlew build

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Upload Detekt Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7

      - name: Upload Lint Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*'
          retention-days: 7
